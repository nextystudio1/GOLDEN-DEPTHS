<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#10151d"><title>GOLDEN DEPTHS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script>
<style>
:root{color-scheme:dark;--bg:#10151d;--panel:#1b2531;--gold:#f6c65b;--muted:#9eacbb}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#263748,var(--bg) 60%);color:#f5f7fa;font:15px system-ui;min-height:100vh}
main{max-width:960px;margin:auto;padding:18px}.brand{font-weight:900;letter-spacing:3px;color:var(--gold);font-size:clamp(22px,5vw,36px)}
.sub{color:var(--muted);margin:4px 0 18px}.card{background:#1b2531eF;border:1px solid #344454;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 12px 35px #0004}
input,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #405064;background:#111a24;color:white}input{width:100%;margin:5px 0 10px}button{background:#bd8428;border:0;color:#17120a;font-weight:800;cursor:pointer;margin:4px}button.secondary{background:#35485a;color:white}button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#111a24;border-radius:12px;padding:12px}.stat small{color:var(--muted)}.stat strong{display:block;color:var(--gold);font-size:21px}
#game{display:none}.mine{height:220px;border-radius:14px;background:linear-gradient(#172a3b,#111820);display:grid;place-items:center;text-align:center;position:relative;overflow:hidden}.pick{font-size:68px;filter:drop-shadow(0 6px 10px #0008)}.ore{color:var(--gold);font-weight:800}.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.item{background:#111a24;padding:10px;border-radius:10px}
.notice{color:#f2cf81;min-height:22px}.muted{color:var(--muted)}@media(max-width:520px){main{padding:12px}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:9px}.stat strong{font-size:17px}}
</style></head>
<body><main>
<div class="brand">GOLDEN DEPTHS</div><div class="sub">2D Online Mining Adventure</div>
<section id="auth" class="card"><h2>Masuk ke dunia tambang</h2><label>Email</label><input id="email" type="email" placeholder="email@example.com"><label>Password</label><input id="password" type="password" placeholder="Minimal 6 karakter"><div class="row"><button id="signup">Daftar</button><button id="login" class="secondary">Masuk</button></div><div id="authmsg" class="notice"></div></section>
<section id="game">
<div class="card row"><div><b id="player">Penambang</b><div class="muted">Petualangan dimulai!</div></div><button id="logout" class="secondary">Keluar</button></div>
<div class="card stats"><div class="stat"><small>GOLD</small><strong id="gold">0</strong></div><div class="stat"><small>LEVEL</small><strong id="level">1</strong></div><div class="stat"><small>PICKAXE</small><strong id="picklevel">1</strong></div></div>
<div class="card"><div class="mine"><div><div class="pick">⛏️</div><div class="ore">AREA TAMBANG</div><div class="muted">Ketuk tombol untuk menambang</div></div></div><div class="row"><button id="mine">⛏️ MULAI MENAMBANG</button><button id="sell" class="secondary">Jual Semua Ore</button><button id="upgrade" class="secondary">Upgrade Pickaxe</button></div><div id="gamemsg" class="notice"></div></div>
<div class="card"><h3>🎒 Backpack</h3><div id="inventory" class="items"><div class="muted">Belum ada item</div></div></div>
</section>
</main>
<script>
const cfg=window.GOLDEN_CONFIG||{};
const client=window.supabase?.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
let busy=false;
function message(id,text){$(id).textContent=text}
function showGame(on){$('auth').style.display=on?'none':'block';$('game').style.display=on?'block':'none'}
async function authAction(kind){
 if(!client){message('authmsg','Konfigurasi server belum tersedia.');return}
 const email=$('email').value.trim(),password=$('password').value;
 if(!email||password.length<6){message('authmsg','Isi email dan password minimal 6 karakter.');return}
 message('authmsg','Memproses...');
 const result=kind==='signup'?await client.auth.signUp({email,password}):await client.auth.signInWithPassword({email,password});
 if(result.error){message('authmsg',result.error.message);return}
 if(!result.data.session){message('authmsg','Pendaftaran berhasil. Periksa email untuk verifikasi, lalu masuk.');return}
 message('authmsg','Berhasil!');await enterGame(result.data.user);
}
async function enterGame(user){
 showGame(true);$('player').textContent=user.email||'Penambang';
 const {error}=await client.rpc('golden_start',{p_username:(user.email||'miner').split('@')[0].slice(0,20)});
 if(error){message('gamemsg','Akun terhubung, tetapi inisialisasi pemain gagal: '+error.message);return}
 await refresh();
}
async function refresh(){
 const {data:userData}=await client.auth.getUser();if(!userData.user)return;
 const [state,inv,profile]=await Promise.all([
 client.from('golden_player_state').select('*').eq('user_id',userData.user.id).maybeSingle(),
 client.from('golden_inventory').select('item_id,quantity,golden_item_catalog(name,rarity)').eq('user_id',userData.user.id),
 client.from('golden_profiles').select('username').eq('user_id',userData.user.id).maybeSingle()
 ]);
 if(state.data){$('gold').textContent=Number(state.data.gold||0).toLocaleString('id-ID');$('level').textContent=state.data.level||1;$('picklevel').textContent=state.data.pickaxe_level||1}
 if(profile.data?.username)$('player').textContent=profile.data.username;
 $('inventory').innerHTML=(inv.data||[]).length?(inv.data||[]).map(x=>'<div class="item">'+(x.golden_item_catalog?.name||x.item_id)+'<br><b>× '+x.quantity+'</b></div>').join(''):'<div class="muted">Backpack masih kosong. Ayo menambang!</div>';
}
async function action(rpc){
 if(busy)return;busy=true;['mine','sell','upgrade'].forEach(id=>$(id).disabled=true);
 message('gamemsg','Memproses aksi...');
 const {data,error}=await client.rpc(rpc);
 if(error)message('gamemsg','Aksi gagal: '+error.message);
 else message('gamemsg',typeof data==='string'?data:'Berhasil!');
 await refresh();busy=false;['mine','sell','upgrade'].forEach(id=>$(id).disabled=false);
}
$('signup').onclick=()=>authAction('signup');$('login').onclick=()=>authAction('login');
$('mine').onclick=()=>action('golden_mine');$('sell').onclick=()=>action('golden_sell_all');$('upgrade').onclick=()=>action('golden_upgrade_pickaxe');
$('logout').onclick=async()=>{await client.auth.signOut();showGame(false)};
(async()=>{if(!client){message('authmsg','Konfigurasi Supabase belum terbaca.');return}const {data}=await client.auth.getSession();if(data.session)await enterGame(data.session.user)})();
</script></body></html>
