name: ORBIT Android Build
on:
  push:
    branches: [orbit-development]
    paths:
      - 'ORBIT/**'
      - '.github/workflows/orbit-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        working-directory: ORBIT
        run: npm install --no-audit --no-fund
      - name: Check game JavaScript
        working-directory: ORBIT
        run: npm run check
      - name: Generate Android project
        working-directory: ORBIT
        run: npx cap add android
      - name: Sync game into Android
        working-directory: ORBIT
        run: npx cap sync android
      - name: Force landscape orientation
        working-directory: ORBIT
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('android:name=".MainActivity"', 'android:name=".MainActivity" android:screenOrientation="landscape"')
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: ORBIT/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-android-debug
          path: ORBIT/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
