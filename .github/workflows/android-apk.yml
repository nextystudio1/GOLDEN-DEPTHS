name: Build Golden Depths APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'config.js'
      - 'privacy.html'
      - 'account-deletion.html'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read
  actions: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses and install platform
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Bundle complete game into Android assets
        run: |
          mkdir -p android/app/src/main/assets/game/assets
          cp index.html config.js privacy.html account-deletion.html android/app/src/main/assets/game/
          cp assets/*.svg android/app/src/main/assets/game/assets/
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: golden-depths-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
