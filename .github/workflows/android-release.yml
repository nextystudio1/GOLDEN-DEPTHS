name: Build VELMORA production release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'config.js'
      - 'privacy.html'
      - 'account-deletion.html'
      - 'assets/**'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

jobs:
  signed-production-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses and install platform
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare release signing key
        id: signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_PASSWORD" && -n "$KEY_ALIAS" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/velmora-release.jks"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            STORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS="velmora-upload"
            keytool -genkeypair -keystore "$RUNNER_TEMP/velmora-release.jks" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=VELMORA, OU=Android, O=Nexty Studio, L=Medan, ST=North Sumatra, C=ID"
            {
              echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            } > "$RUNNER_TEMP/SIGNING-CREDENTIALS.txt"
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
          test -s "$RUNNER_TEMP/velmora-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/velmora-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/velmora-release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Bundle complete game into Android assets
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/game/assets
          cp index.html config.js privacy.html account-deletion.html android/app/src/main/assets/game/
          cp assets/*.svg android/app/src/main/assets/game/assets/

      - name: Build signed production APK and Play bundle
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Verify signed production outputs
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          jarsigner -verify "$AAB" >/dev/null

      - name: Assemble production package
        env:
          GENERATED_KEY: ${{ steps.signing.outputs.generated }}
        run: |
          set -euo pipefail
          mkdir -p release-package
          cp android/app/build/outputs/apk/release/app-release.apk release-package/VELMORA-0.3.0-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release-package/VELMORA-0.3.0-release.aab
          if [[ "$GENERATED_KEY" == "true" ]]; then
            cp "$RUNNER_TEMP/velmora-release.jks" release-package/VELMORA-release-key.jks
            cp "$RUNNER_TEMP/SIGNING-CREDENTIALS.txt" release-package/SIGNING-CREDENTIALS.txt
          fi
          (cd release-package && sha256sum VELMORA-0.3.0-release.apk VELMORA-0.3.0-release.aab > SHA256SUMS.txt)
          cd release-package && zip -9 ../VELMORA-0.3.0-PRODUCTION.zip *

      - name: Upload production APK, AAB and signing backup
        uses: actions/upload-artifact@v4
        with:
          name: velmora-production-release
          path: VELMORA-0.3.0-PRODUCTION.zip
          if-no-files-found: error
          retention-days: 90
