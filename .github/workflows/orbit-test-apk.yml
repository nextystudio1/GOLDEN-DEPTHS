name: ORBIT Android Test APK

on:
  push:
    branches: [orbit-development]
    paths:
      - "ORBIT/**"
      - ".github/workflows/orbit-test-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ORBIT
        uses: actions/checkout@v4
        with:
          ref: orbit-development
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies and validate game
        working-directory: ORBIT
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Generate and sync Android project
        working-directory: ORBIT
        run: |
          npx cap add android
          npx cap sync android
      - name: Set landscape orientation
        working-directory: ORBIT
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          if 'android:screenOrientation="landscape"' not in source:
              needle = 'android:name=".MainActivity"'
              if needle not in source:
                  raise SystemExit("Could not find Capacitor MainActivity in manifest")
              manifest.write_text(source.replace(
                  needle,
                  needle + ' android:screenOrientation="landscape"',
                  1
              ))
          PY
      - name: Build installable debug APK
        working-directory: ORBIT/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-Android-Test-APK
          path: ORBIT/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
