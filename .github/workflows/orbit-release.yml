name: ORBIT Signed Production Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version (example: 0.1.0)"
        required: true
        default: "0.1.0"
        type: string
      version_code:
        description: "Android versionCode (must increase for each Play upload)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: orbit-development

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${name/KEYSTORE_BASE64/ANDROID_KEYSTORE_BASE64}"
              exit 1
            fi
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies and run checks
        working-directory: ORBIT
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Generate and sync Android project
        working-directory: ORBIT
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure landscape, immersive fullscreen and release signing
        working-directory: ORBIT
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/orbit-upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/orbit-upload.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/orbit-upload.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = re.sub(r'(android:name="\.MainActivity")', r'\1 android:screenOrientation="landscape"', text, count=1) if 'android:screenOrientation="landscape"' not in text else text
          manifest.write_text(text)
          assert 'android:screenOrientation="landscape"' in text
          candidates = list(Path('android/app/src/main').rglob('MainActivity.java'))
          if not candidates:
              raise SystemExit('Capacitor MainActivity.java not found')
          p = candidates[0]
          src = p.read_text()
          if 'ORBIT_IMMERSIVE_FULLSCREEN' not in src:
              src = src.replace('import com.getcapacitor.BridgeActivity;', '''import com.getcapacitor.BridgeActivity;
          import android.os.Bundle;
          import android.os.Build;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;''')
              match = re.search(r'public class MainActivity extends BridgeActivity\s*\{\s*\}', src)
              if not match:
                  raise SystemExit('Unexpected Capacitor MainActivity template')
              body = '''public class MainActivity extends BridgeActivity {
              // ORBIT_IMMERSIVE_FULLSCREEN
              private void hideSystemBars() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      WindowInsetsController controller = getWindow().getInsetsController();
                      if (controller != null) {
                          controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
                  }
              }
              @Override public void onCreate(Bundle state) { super.onCreate(state); hideSystemBars(); }
              @Override public void onWindowFocusChanged(boolean focus) { super.onWindowFocusChanged(focus); if (focus) hideSystemBars(); }
              @Override public void onResume() { super.onResume(); hideSystemBars(); }
          }'''
              src = src[:match.start()] + body + src[match.end():]
              p.write_text(src)
          gradle = Path('android/app/build.gradle')
          src = gradle.read_text()
          if 'signingConfigs {' not in src:
              block = '''
              signingConfigs {
                  release {
                      storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
          '''
              src = src.replace('    buildTypes {', block + '\n    buildTypes {', 1)
          src = re.sub(r'versionCode\s+\d+', 'versionCode ' + os.environ['VERSION_CODE'], src, count=1)
          src = re.sub(r"versionName\s+['\"][^'\"]+['\"]", "versionName '" + os.environ['VERSION_NAME'] + "'", src, count=1)
          src = re.sub(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', src, count=1)
          gradle.write_text(src)
          assert 'signingConfig signingConfigs.release' in src
          print('Configured signed ORBIT release:', os.environ['VERSION_NAME'], os.environ['VERSION_CODE'])
          PY

      - name: Build signed APK and Play AAB
        working-directory: ORBIT/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Verify release signatures
        run: |
          set -euo pipefail
          APK="ORBIT/android/app/build/outputs/apk/release/app-release.apk"
          AAB="ORBIT/android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          jarsigner -verify "$AAB" >/dev/null

      - name: Package signed release outputs
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          mkdir -p release-package
          cp ORBIT/android/app/build/outputs/apk/release/app-release.apk "release-package/ORBIT-${VERSION_NAME}-release.apk"
          cp ORBIT/android/app/build/outputs/bundle/release/app-release.aab "release-package/ORBIT-${VERSION_NAME}-release.aab"
          (cd release-package && sha256sum * > SHA256SUMS.txt)
          cd release-package && zip -9 "../ORBIT-${VERSION_NAME}-SIGNED-RELEASE.zip" *

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-signed-production-release
          path: ORBIT-*-SIGNED-RELEASE.zip
          if-no-files-found: error
          retention-days: 90
