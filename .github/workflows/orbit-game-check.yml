name: ORBIT Game Checks
on:
  push:
    branches: [orbit-development]
    paths:
      - 'ORBIT/game/**'
      - 'ORBIT/scripts/**'
      - 'ORBIT/package.json'
      - '.github/workflows/orbit-game-check.yml'
  pull_request:
    paths:
      - 'ORBIT/game/**'
      - 'ORBIT/scripts/**'
      - 'ORBIT/package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install game dependencies
        working-directory: ORBIT
        run: npm install --no-audit --no-fund
      - name: Check game code and gameplay contracts
        working-directory: ORBIT
        run: npm run check
